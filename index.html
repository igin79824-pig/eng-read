<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Junior High English Reading Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .reading-highlight {
      background-color: #fef08a;
      transition: background-color 0.2s ease;
      border-radius: 3px;
      padding: 1px 3px;
    }
    .wave-bar {
      display: inline-block;
      width: 3px;
      margin: 0 1px;
      background-color: #3b82f6;
      border-radius: 2px;
      animation: soundwave 1s infinite ease-in-out;
    }
    .wave-bar:nth-child(1) { height: 6px; animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { height: 14px; animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { height: 18px; animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { height: 12px; animation-delay: 0.15s; }
    .wave-bar:nth-child(5) { height: 8px; animation-delay: 0.25s; }

    @keyframes soundwave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600 rounded-lg shadow-inner">
          <i class="fa-solid fa-book-open-reader text-2xl text-amber-300"></i>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Junior High English Reading Hub</h1>
          <p class="text-xs text-indigo-200">Interactive Curriculum Reader & Audio Accompaniment</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openAddModal()" class="inline-flex items-center gap-2 bg-amber-400 hover:bg-amber-300 text-indigo-950 font-semibold px-4 py-2 rounded-lg shadow transition text-sm">
          <i class="fa-solid fa-plus"></i> Add Article
        </button>
      </div>
    </div>

    <!-- Tier 1: Grade Navigation Tabs -->
    <div class="max-w-7xl mx-auto px-4 border-t border-indigo-600/60 overflow-x-auto">
      <nav class="flex space-x-2 py-2" id="gradeTabsContainer">
        <!-- Rendered dynamically -->
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    <!-- Tier 2: Category Tabs & Search Bar -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <!-- Category Buttons -->
        <div class="flex flex-wrap items-center gap-2" id="categoryTabsContainer">
          <!-- Rendered dynamically -->
        </div>

        <!-- Filter & Search -->
        <div class="relative w-full lg:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input 
            type="text" 
            id="searchInput" 
            oninput="handleSearch(this.value)" 
            placeholder="Search keywords or titles..." 
            class="w-full pl-9 pr-4 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50"
          />
        </div>
      </div>
    </div>

    <!-- Category Description Header -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center space-x-2 text-slate-600 text-sm">
        <i class="fa-regular fa-folder-open text-indigo-600"></i>
        <span class="font-medium" id="currentSectionTitle">Loading...</span>
        <span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full text-xs font-semibold" id="articleCountBadge">0 articles</span>
      </div>
    </div>

    <!-- Article Cards Container -->
    <div id="articlesGrid" class="grid grid-cols-1 gap-6">
      <!-- Article cards populated dynamically -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 bg-white rounded-xl border border-dashed border-slate-300 p-8">
      <i class="fa-solid fa-inbox text-5xl text-slate-300 mb-3"></i>
      <h3 class="text-base font-semibold text-slate-700">No articles found</h3>
      <p class="text-sm text-slate-400 mt-1">There are no reading articles under this section yet.</p>
    </div>
  </main>

  <!-- Add Article Modal -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6">
      <div class="flex items-center justify-between pb-3 border-b border-slate-200">
        <h3 class="text-lg font-bold text-slate-800">Add New Article</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="newArticleForm" onsubmit="saveArticle(event)" class="mt-4 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Grade Semester</label>
            <select id="modalGradeSelect" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500">
              <option value="7A">Grade 7 - Sem 1</option>
              <option value="7B">Grade 7 - Sem 2</option>
              <option value="8A">Grade 8 - Sem 1</option>
              <option value="8B">Grade 8 - Sem 2</option>
              <option value="9A">Grade 9 - Sem 1</option>
              <option value="9B">Grade 9 - Sem 2</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Category</label>
            <select id="modalCategorySelect" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500">
              <option value="family">Family & Occupations</option>
              <option value="activities">Activities & Rules</option>
              <option value="animals">Animals & Dates</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Article Title</label>
          <input type="text" id="modalTitle" required class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500" placeholder="e.g. My Favorite Living Room" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Target Vocabulary / Supplementary Notes</label>
          <input type="text" id="modalExtraVocab" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500" placeholder="e.g. favorite (adj.), cousin (n.)" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Custom Audio File URL (Optional, uses TTS by default)</label>
          <input type="url" id="modalAudioUrl" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500" placeholder="https://example.com/audio.mp3" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Passage Content</label>
          <textarea id="modalContent" rows="6" required class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 font-serif leading-relaxed" placeholder="Type the reading passage text here..."></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg font-medium">Cancel</button>
          <button type="submit" class="px-5 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold shadow">Save Article</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
    Junior High School English Reading Resource Platform &copy; All Rights Reserved.
  </footer>

    // Render Grade Tabs (Level 1)

      const container = document.getElementById("gradeTabsContainer");

                : 'text-indigo-100 hover:bg-indigo-600/70 hover:text-white'
            }"
          >
            ${g.name}
          </button>
        `;
      }).join('');
    }

    // Switch Grade
    function switchGrade(gradeId) {
      if (currentGrade === gradeId) return;
      stopAudio();
      currentGrade = gradeId;
      const cats = CATEGORIES[gradeId] || [];
      currentCategory = cats.length > 0 ? cats[0].id : "";
      renderGradeTabs();
      renderCategoryTabs();
      renderArticles();
    }

    // Render Category Tabs (Level 2)
    function renderCategoryTabs() {
      const container = document.getElementById("categoryTabsContainer");
      const cats = CATEGORIES[currentGrade] || [];

        container.innerHTML = `<span class="text-xs text-slate-400">No categories</span>`;
        return;

            class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${

            <i class="fa-solid ${c.icon}"></i>
            ${c.name}
          </button>
        `;
      }).join('');
    }

    // Switch Category
    function switchCategory(catId) {
      if (currentCategory === catId) return;
      stopAudio();
      currentCategory = catId;
      renderCategoryTabs();
      renderArticles();
    }

    // Handle Search
    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      renderArticles();
    }

    // Filter and Display Articles

      const titleSpan = document.getElementById("currentSectionTitle");

      const currentCatObj = (CATEGORIES[currentGrade] || []).find(c => c.id === currentCategory);
      titleSpan.textContent = `${currentGradeObj ? currentGradeObj.name : ''} > ${currentCatObj ? currentCatObj.name : 'All'}`;

      let filtered = articlesData.filter(item => {
        const matchGrade = item.grade === currentGrade;
        const matchCategory = !currentCategory || item.categoryId === currentCategory;
        const matchSearch = !searchQuery || 
          item.title.toLowerCase().includes(searchQuery) || 
          item.content.toLowerCase().includes(searchQuery) ||
          item.extraVocab.toLowerCase().includes(searchQuery);
        return matchGrade && matchCategory && matchSearch;
      });

        grid.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      grid.innerHTML = filtered.map(renderArticleCard).join('');
    }

    // Split text into readable sentences
    function splitIntoSentences(text) {
      return text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
    }

    // Render Single Article Card
    function renderArticleCard(article) {
      const sentences = splitIntoSentences(article.content);
      const formattedContent = sentences.map((s, idx) =>

              <select

                <!-- Hidden Local Audio File Input -->
                <input

                />
                <button

                >

          <!-- Extra Vocabulary Banner -->

          ` : ''}

          <!-- Article Content -->

          <!-- Questions Collapsible Accordion -->
          ${article.questions && article.questions.length > 0 ? `

    // Audio Control: Toggle Play/Pause
    function togglePlay(articleId) {
      const article = articlesData.find(a => a.id === articleId);
      if (!article) return;

      const modeSelect = document.getElementById(`mode-select-${articleId}`);
      const mode = modeSelect ? modeSelect.value : 'tts';

      // If switching to a different article
      if (audioState.activeId && audioState.activeId !== articleId) {
        stopAudio();
      }

      audioState.activeId = articleId;
      audioState.mode = mode;

      if (mode === 'tts') {
        handleTTSPlayback(article);
      } else {
        handleCustomAudioPlayback(article);
      }
    }

    // TTS Web Speech API Playback Handler
    function handleTTSPlayback(article) {
      if (!('speechSynthesis' in window)) {
        alert("Your browser does not support Web Speech API synthesis.");
        return;
      }

      // If paused, resume
      if (audioState.isPlaying && audioState.isPaused) {
        window.speechSynthesis.resume();
        audioState.isPaused = false;
        updatePlayerUI(article.id, true);
        return;
      }

      // If playing, pause
      if (audioState.isPlaying && !audioState.isPaused) {
        window.speechSynthesis.pause();
        audioState.isPaused = true;
        updatePlayerUI(article.id, false, true);
        return;
      }

      // Start new TTS playback
      window.speechSynthesis.cancel();
      clearHighlights(article.id);

      audioState.sentences = splitIntoSentences(article.content);
      audioState.currentSentenceIdx = 0;
      audioState.isPlaying = true;
      audioState.isPaused = false;

      playNextSentence(article.id);
    }

    // Play next sentence with highlight tracking
    function playNextSentence(articleId) {
      if (!audioState.isPlaying || audioState.currentSentenceIdx >= audioState.sentences.length) {
        stopAudio();
        return;
      }

      const idx = audioState.currentSentenceIdx;
      const sentenceText = audioState.sentences[idx];

      // Highlight current sentence
      clearHighlights(articleId);
      const spanEl = document.getElementById(`s-${articleId}-${idx}`);
      if (spanEl) {
        spanEl.classList.add("reading-highlight");
        spanEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      const utterance = new SpeechSynthesisUtterance(sentenceText);
      utterance.lang = "en-US";
      utterance.rate = audioState.rate;

      utterance.onend = () => {
        audioState.currentSentenceIdx++;
        playNextSentence(articleId);
      };

      utterance.onerror = (e) => {
        console.error("SpeechSynthesis error:", e);
        stopAudio();
      };

      audioState.utterance = utterance;
      updatePlayerUI(articleId, true);
      window.speechSynthesis.speak(utterance);
    }

    // Custom Recorded Audio File Playback
    function handleCustomAudioPlayback(article) {
      if (!article.audioUrl) {
        alert("Please upload an MP3 audio file or provide a valid audio URL first.");
        return;
      }

      if (!audioState.audioElement) {
        audioState.audioElement = new Audio(article.audioUrl);
        audioState.audioElement.playbackRate = audioState.rate;

        audioState.audioElement.onended = () => {
          stopAudio();
        };

        audioState.audioElement.onerror = () => {
          alert("Error loading custom audio file. Please check format or URL.");
          stopAudio();
        };
      }

      if (audioState.audioElement.paused) {
        audioState.audioElement.play();
        audioState.isPlaying = true;
        audioState.isPaused = false;
        updatePlayerUI(article.id, true);
      } else {
        audioState.audioElement.pause();
        audioState.isPlaying = true;
        audioState.isPaused = true;
        updatePlayerUI(article.id, false, true);
      }
    }

    // Stop and Reset Audio State
    function stopAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (audioState.audioElement) {
        audioState.audioElement.pause();
        audioState.audioElement.currentTime = 0;
        audioState.audioElement = null;
      }
      if (audioState.activeId) {
        clearHighlights(audioState.activeId);
        updatePlayerUI(audioState.activeId, false);
      }
      audioState.activeId = null;
      audioState.isPlaying = false;
      audioState.isPaused = false;
      audioState.currentSentenceIdx = 0;
    }

    // Set Audio Speed Rate
    function setAudioSpeed(articleId, speedVal) {
      audioState.rate = parseFloat(speedVal);
      if (audioState.audioElement) {
        audioState.audioElement.playbackRate = audioState.rate;
      }
      // If currently playing TTS, restart current sentence with new rate
      if (audioState.isPlaying && audioState.mode === 'tts' && !audioState.isPaused) {
        window.speechSynthesis.cancel();
        playNextSentence(articleId);
      }
    }

    // Switch between TTS and Custom Audio
    function switchAudioMode(articleId, mode) {
      const uploadBtn = document.getElementById(`upload-btn-${articleId}`);
      if (mode === 'custom') {
        uploadBtn.classList.remove('hidden');
      } else {
        uploadBtn.classList.add('hidden');
      }
      if (audioState.activeId === articleId) {
        stopAudio();
      }
    }

    // Handle Local Audio Upload via File Input
    function handleLocalAudioUpload(articleId, event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileUrl = URL.createObjectURL(file);
      const article = articlesData.find(a => a.id === articleId);
      if (article) {
        article.audioUrl = fileUrl;
        alert(`Attached "${file.name}" to this passage successfully! Click Play to listen.`);
      }
    }

    // Clear Highlight Spans
    function clearHighlights(articleId) {
      const container = document.getElementById(`content-${articleId}`);
      if (container) {
        const spans = container.querySelectorAll(".reading-highlight");
        spans.forEach(s => s.classList.remove("reading-highlight"));
      }
    }

    // Update Player Bar UI
    function updatePlayerUI(articleId, isPlaying, isPaused = false) {
      const playBtn = document.getElementById(`btn-play-${articleId}`);
      const wave = document.getElementById(`wave-${articleId}`);

      if (!playBtn) return;

      if (isPlaying) {
        playBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
        playBtn.classList.replace("bg-indigo-600", "bg-amber-500");
        playBtn.classList.replace("hover:bg-indigo-700", "hover:bg-amber-600");
        if (wave) wave.classList.remove("hidden");
      } else if (isPaused) {
        playBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
        playBtn.classList.replace("bg-amber-500", "bg-indigo-600");
        playBtn.classList.replace("hover:bg-amber-600", "hover:bg-indigo-700");
        if (wave) wave.classList.add("hidden");
      } else {
        playBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
        playBtn.classList.replace("bg-amber-500", "bg-indigo-600");
        playBtn.classList.replace("hover:bg-amber-600", "hover:bg-indigo-700");
        if (wave) wave.classList.add("hidden");
      }
    }

    // Modal Control
    function openAddModal() {
      document.getElementById("modalGradeSelect").value = currentGrade;
      document.getElementById("modalCategorySelect").value = currentCategory || "family";
      document.getElementById("addModal").classList.remove("hidden");
    }

    function closeAddModal() {
      document.getElementById("addModal").classList.add("hidden");
      document.getElementById("newArticleForm").reset();
    }

    // Save New Article
    function saveArticle(e) {
      e.preventDefault();
      const grade = document.getElementById("modalGradeSelect").value;
      const cat = document.getElementById("modalCategorySelect").value;
      const title = document.getElementById("modalTitle").value;
      const extraVocab = document.getElementById("modalExtraVocab").value || "None";
      const audioUrl = document.getElementById("modalAudioUrl").value;
      const content = document.getElementById("modalContent").value;

      const words = content.trim().split(/\s+/).filter(Boolean).length;

      const newArticle = {
        id: "art-" + Date.now(),
        grade: grade,
        categoryId: cat,
        title: title,
        sourcePage: "Custom Add",
        wordCount: words,
        extraVocab: extraVocab,
        audioUrl: audioUrl,
        content: content,
        questions: []
      };

      articlesData.unshift(newArticle);
      closeAddModal();

      // Switch to targeted tab
      currentGrade = grade;
      currentCategory = cat;
      renderGradeTabs();
      renderCategoryTabs();
      renderArticles();
    }
  </script>
</body>
</html>
